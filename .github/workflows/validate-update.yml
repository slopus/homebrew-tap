name: Validate latest stable Happy candidate

on:
  pull_request:
    paths: [Casks/**, scripts/**, package*.json, .github/workflows/cask-test.yml, .github/workflows/update-happy.yml, .github/workflows/validate-update.yml]
  workflow_dispatch:

permissions:
  contents: read

# Runs the exact publication gate without permission to publish a cask.
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node --test scripts/update-happy.test.mjs
      - name: Generate current GitHub Latest candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-happy.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-cask
          path: Casks/happy.rb
          if-no-files-found: error
  test:
    needs: prepare
    uses: ./.github/workflows/cask-test.yml
    with:
      candidate: true