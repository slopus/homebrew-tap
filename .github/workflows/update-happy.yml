name: Update Happy from stable release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-happy
  cancel-in-progress: false

jobs:
  prepare:
    # A branch dispatch can validate in validate-update.yml, never publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.generate.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: node --test scripts/update-happy.test.mjs
      - name: Generate candidate from upstream stable release
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/update-happy.mjs
          if git diff --quiet -- Casks/happy.rb; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The published cask already matches GitHub Latest; no update needed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.generate.outputs.changed == 'true'
        with:
          name: candidate-cask
          path: Casks/happy.rb
          if-no-files-found: error
  test:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/cask-test.yml
    with:
      candidate: true
  publish:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-cask
          path: Casks
      - name: Recheck Latest and unchanged tap before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo '::error::Tap main changed during testing. Run the updater again.'
            exit 1
          }
          node scripts/update-happy.mjs --check
      - name: Commit only the tested candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/happy.rb
          git commit -m "happy: update to tested stable release"
          git push origin HEAD:main
          echo 'Published the cask after install, boot, and uninstall checks passed.' >> "$GITHUB_STEP_SUMMARY"
  report:
    needs: [prepare, test, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report delivery status and retry instructions
        env:
          PREPARE: ${{ needs.prepare.result }}
          TEST: ${{ needs.test.result }}
          PUBLISH: ${{ needs.publish.result }}
          CHANGED: ${{ needs.prepare.outputs.changed }}
        run: |
          echo "Stable cask delivery: prepare=$PREPARE, install/boot/uninstall=$TEST, publish=$PUBLISH." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PREPARE" == success && "$CHANGED" == false ]]; then
            echo 'Already current. No publication required.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PUBLISH" != success ]]; then
            echo '::error::Stable cask delivery did not publish. Inspect the failed jobs and launch evidence, then run Update Happy from stable release on main again. The hourly schedule also retries using GitHub Latest.'
            echo 'Delivery failed. Inspect failed jobs and happy-cask-* artifacts, then rerun the workflow on main. Hourly scheduled runs also retry. No smoke, signature, checksum, or downgrade gate is bypassed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
